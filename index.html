    // Safe LocalStorage Wrapper (Mencegah Blank Screen akibat Blocked Cookies/Private Mode)
    const safeStorage = {
      getItem: function(key) {
        try { return localStorage.getItem(key); } catch(e) { return null; }
      },
      setItem: function(key, val) {
        try { localStorage.setItem(key, val); } catch(e) {}
      },
      removeItem: function(key) {
        try { localStorage.removeItem(key); } catch(e) {}
      }
    };

    // PWA Dynamic Manifest
    try {
      const manifestJson = {
        "short_name": "BimbelApp",
        "name": window.APP_CONFIG.appName,
        "icons": [
          { "src": window.APP_CONFIG.appLogo, "type": "image/png", "sizes": "192x192" },
          { "src": window.APP_CONFIG.appLogo, "type": "image/png", "sizes": "512x512" }
        ],
        "start_url": "./",
        "background_color": "#FFFFFF",
        "theme_color": window.APP_CONFIG.primaryColor,
        "display": "standalone"
      };
      const blobManifest = new Blob([JSON.stringify(manifestJson)], { type: 'application/json' });
      const manifestUrl = URL.createObjectURL(blobManifest);
      const linkManifest = document.createElement('link');
      linkManifest.rel = 'manifest';
      linkManifest.href = manifestUrl;
      document.head.appendChild(linkManifest);
    } catch(e) { console.warn("PWA Manifest Init Skipped", e); }
  </script>

    function saveLocalDBCache() {
      safeStorage.setItem('bimbel_db_cache', JSON.stringify(dummyDB));
    }

    function loadLocalDBCache() {
      const cached = safeStorage.getItem('bimbel_db_cache');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (parsed && typeof parsed === 'object') {
            dummyDB = { ...dummyDB, ...parsed };
            return true;
          }
        } catch(e) {
          console.warn("Gagal memuat cache lokal, menggunakan default.");
        }
      }
      return false;
    }

    function updateSyncIndicator(status, text) {
      const dBadge = document.getElementById('sync-status-badge-desktop');
      const mBadge = document.getElementById('sync-status-badge-mobile');

      let colorClasses = {
        syncing: "text-amber-400 bg-amber-950/80 border-amber-800/50",
        synced: "text-emerald-400 bg-emerald-950/80 border-emerald-800/50",
        error: "text-red-400 bg-red-950/80 border-red-800/50"
      };

      let iconClass = {
        syncing: "fa-solid fa-arrows-rotate fa-spin text-[8px]",
        synced: "fa-solid fa-circle-check text-[8px]",
        error: "fa-solid fa-circle-exclamation text-[8px]"
      };

      const selectedColor = colorClasses[status] || colorClasses.synced;
      const selectedIcon = iconClass[status] || iconClass.synced;

      if (dBadge) {
        dBadge.className = `flex items-center gap-1 font-bold px-2 py-0.5 rounded-full border ${selectedColor}`;
        dBadge.innerHTML = `<i class="${selectedIcon}"></i><span>${text}</span>`;
      }
      if (mBadge) {
        mBadge.className = `inline-flex items-center gap-1 text-[9px] font-bold ${status === 'syncing' ? 'text-amber-300' : status === 'error' ? 'text-red-400' : 'text-emerald-400'}`;
        mBadge.innerHTML = `<i class="${selectedIcon}"></i><span>${text}</span>`;
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        // 1. Instantly restore database from Local Cache
        loadLocalDBCache();

        // 2. Check login session
        const savedUser = safeStorage.getItem('bimbel_session_user');
        if (savedUser) {
          try {
            currentUser = JSON.parse(savedUser);
            // Render UI immediately from cache (0ms wait time for user!)
            initAppShell();
            
            // Trigger background sync silently without blocking UI
            fetchAndRefreshData(true);
            return;
          } catch (e) {
            safeStorage.removeItem('bimbel_session_user');
          }
        }
        // If no user session, show login screen
        document.getElementById('login-view').classList.remove('hidden');
      } catch(err) {
        console.error("Initialization error:", err);
        showEmergencyError("Error Inisialisasi: " + err.message);
      }
    });

    function showEmergencyError(msg) {
      const box = document.getElementById('emergency-error-box');
      const text = document.getElementById('emergency-error-msg');
      if (box && text) {
        text.textContent = msg;
        box.classList.remove('hidden');
      }
    }

    // Dual-Mode Universal API Call (CORS-Compliant Simple Request & Non-blocking)
    async function apiCall(action, data = {}) {
      updateSyncIndicator('syncing', 'Menyinkron...');

      if (IS_PREVIEW) {
        return new Promise((resolve) => {
          setTimeout(() => { 
            const res = handleDummyApi(action, data);
            saveLocalDBCache();
            lastSyncTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            updateSyncIndicator('synced', `Sync ${lastSyncTime}`);
            resolve(res); 
          }, 150);
        });
      }

      // Option A: Native Apps Script Web App iframe runtime
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler((res) => {
              saveLocalDBCache();
              lastSyncTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
              updateSyncIndicator('synced', `Sync ${lastSyncTime}`);
              resolve(res);
            })
            .withFailureHandler((err) => {
              console.error("GAS Execution Error:", err);
              updateSyncIndicator('error', 'Gagal Sync');
              reject(err);
            })[action](data);
        });
      }

      // Option B: External site (Blogger) HTTP Request to GAS Web App
      if (GAS_URL && GAS_URL.trim() !== "" && !GAS_URL.includes("URL_DEPLOY_GAS_ANDA_DISINI")) {
        try {
          const response = await fetch(GAS_URL, {
            method: 'POST',
            mode: 'cors',
            redirect: 'follow',

    // Dual-Mode Universal API Call (CORS-Compliant Simple Request & Fallback)
    async function apiCall(action, data = {}) {
      if (IS_PREVIEW) {
        return new Promise((resolve) => {
          setTimeout(() => { resolve(handleDummyApi(action, data)); }, 200);
        });
      }

      // Option A: Native Apps Script Web App iframe runtime
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler((err) => {
              console.error("GAS Execution Error:", err);
              reject(err);
            })[action](data);
        });
      }

      // Option B: External site (Blogger) HTTP Request to GAS Web App
      if (GAS_URL && GAS_URL.trim() !== "" && !GAS_URL.includes("URL_DEPLOY_GAS_ANDA_DISINI")) {
        try {
          // 'text/plain;charset=utf-8' prevents CORS preflight OPTIONS request from failing in GAS
          const response = await fetch(GAS_URL, {
            method: 'POST',
            mode: 'cors',
            redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: action, data: data })
          });

          const res = await response.json();
          return res;
        } catch (err) {
          console.error("Koneksi Google Sheets Error via POST, mencoba GET fallback:", err);

          // GET Fallback for reading data if POST CORS preflight fails
          if (action === 'getAppData' || action === 'loginUser') {
            try {
              const getUrl = `${GAS_URL}?action=${encodeURIComponent(action)}&data=${encodeURIComponent(JSON.stringify(data))}`;
              const getRes = await fetch(getUrl, { mode: 'cors', redirect: 'follow' });
              return await getRes.json();
            } catch (getErr) {
              console.error("GET Fallback Error:", getErr);
            }
          }

          showToast("Gagal terhubung! Pastikan izin Deployment GAS diset ke 'Anyone'.");
          throw err;
        }
      }

      showToast("URL Web App GAS belum dikonfigurasi!");
      return { success: false, message: "Variabel GAS_URL belum dikonfigurasi." };
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const alert = document.getElementById('login-alert');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Checking...`;
      alert.classList.add('hidden');

      const uVal = document.getElementById('username').value.trim();
      const pVal = document.getElementById('password').value.trim();

      try {
        const res = await apiCall('loginUser', { username: uVal, password: pVal });
        if (res.success) {
          currentUser = res.user;
          if (res.appData) {
            syncDataFromBackend(res.appData);
          } else {
            await fetchAndRefreshData();
          }
          safeStorage.setItem('bimbel_session_user', JSON.stringify(currentUser));
          initAppShell();
        } else {
          alert.textContent = res.message || "Username atau Password salah!";
          alert.classList.remove('hidden');
        }
      } catch (err) {
        alert.textContent = "Gagal menghubungkan ke database Google Sheets! Pastikan Izin Deployment diset ke 'Anyone'.";
        alert.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Masuk Aplikasi</span><i class="fa-solid fa-arrow-right text-[10px]"></i>`;
      }
    }

    function handleLogout() {
      currentUser = null;
      activeChildId = null;

    function initDashboardChart(labels, scores) {
      const ctx = document.getElementById('progressChart');
      if (!ctx) return;
      if (chartInstance) { chartInstance.destroy(); }
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.length > 0 ? labels : ['Belum Ada Data'],
          datasets: [{
            label: 'Nilai Siswa',
            data: scores.length > 0 ? scores : [0],
            borderColor: '#1E40AF',
            backgroundColor: 'rgba(30, 64, 175, 0.1)',
            borderWidth: 2.5,
            fill: true,
            tension: 0.35,
            pointBackgroundColor: '#F59E0B',
            pointRadius: 4.5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { min: 0, max: 100, ticks: { font: { size: 10 } } },
            x: { ticks: { font: { size: 10 } } }
          }
        }
      });
    }

    function setStudentStatus(studentId, status) {
      const hiddenInput = document.getElementById(`att-status-${studentId}`);
      if (hiddenInput) hiddenInput.value = status;

      const statuses = ['Hadir', 'Izin', 'Sakit', 'Alfa'];
      const styles = {
        Hadir: 'bg-emerald-600 text-white border-emerald-600 shadow-xs',
        Izin: 'bg-amber-500 text-white border-amber-500 shadow-xs',
        Sakit: 'bg-blue-600 text-white border-blue-600 shadow-xs',
        Alfa: 'bg-red-600 text-white border-red-600 shadow-xs',
        Inactive: 'bg-white text-slate-600 border-slate-300'
      };

      statuses.forEach(st => {
        const btn = document.getElementById(`btn-att-${studentId}-${st}`);
        if (btn) {
          btn.className = `att-pill-btn font-bold px-2.5 py-1 rounded-lg text-[11px] border transition ${st === status ? styles[st] : styles.Inactive}`;
        }
      });
    }

    function markAllAttendanceStatus(status) {
      const classId = document.getElementById('att-class').value;
      const filteredStudents = dummyDB.students.filter(s => s.class_id === classId);
      filteredStudents.forEach(s => { setStudentStatus(s.id, status); });
      showToast(`Semua siswa ditandai '${status}'`);

    async function saveAttendanceData() {
      const dateVal = document.getElementById('att-date').value;
      const classId = document.getElementById('att-class').value;
      const filteredStudents = dummyDB.students.filter(s => s.class_id === classId);

      if (filteredStudents.length === 0) {
        showToast('Tidak ada siswa untuk disimpan!');
        return;
      }

      const records = filteredStudents.map(s => {
        const statusEl = document.getElementById(`att-status-${s.id}`);
        const notesEl = document.getElementById(`att-notes-${s.id}`);
        return {
          student_id: s.id,
          date: dateVal,
          status: statusEl ? statusEl.value : 'Hadir',
          notes: notesEl ? notesEl.value : ''
        };
      });

      await apiCall('saveAttendance', records);
      await fetchAndRefreshData();
      showToast('Presensi Kehadiran Berhasil Disimpan ke Sheet!');
    }

              <span class="text-[10px] text-blue-200 block uppercase font-semibold">Atas Nama</span>
              <span class="font-bold text-white">${cfg.bankHolder || '-'}</span>
            </div>
          </div>
        </div>

        <div class="grid md:grid-cols-2 gap-3">
          ${filteredInvoices.map(inv => {
            const st = dummyDB.students.find(s => s.id === inv.student_id);
            return `
              <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-xs flex flex-col justify-between">
                <div>
                  <div class="flex justify-between items-start text-xs">
                    <span class="font-mono text-slate-500 font-bold">${inv.id}</span>
                    <span class="px-2 py-0.2 rounded text-[9px] font-bold uppercase ${inv.status === 'paid' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">${inv.status}</span>
                  </div>
                  <h3 class="text-xs font-bold text-slate-800 mt-1">${inv.title}</h3>
                  <p class="text-[11px] text-slate-500">Siswa: ${st ? st.name : '-'}</p>
                  <p class="text-base font-extrabold text-blue-900 mt-1">Rp ${Number(inv.amount).toLocaleString('id-ID')}</p>
                </div>

                <div class="mt-3 space-y-1">
                  ${inv.status === 'unpaid' ? `
                    <button onclick="confirmPaymentWA('${inv.id}', '${inv.title}', ${inv.amount}, '${st ? st.name : 'Siswa'}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold py-1.5 rounded-lg flex items-center justify-center gap-1.5 shadow-xs transition">
                      <i class="fa-brands fa-whatsapp text-sm"></i> Konfirmasi Pembayaran via WA
                    </button>
                  ` : ''}

                  ${currentUser.role === 'admin' && inv.status !== 'paid' ? `
                    <button onclick="markInvoicePaid('${inv.id}')" class="w-full bg-blue-800 hover:bg-blue-900 text-white text-[10px] font-bold py-1 rounded">
                      <i class="fa-solid fa-circle-check mr-1"></i> Tandai Lunas (Admin)
                    </button>
                  ` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function openInvoiceModal() {
      showModal('Buat Tagihan SPP', `
        <form onsubmit="saveInvoiceForm(event)" class="space-y-3">
          <div>
            <label class="block font-bold mb-1">Target Siswa</label>
            <select id="inv-student" class="w-full p-2 border rounded text-xs">
              ${dummyDB.students.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block font-bold mb-1">Deskripsi Tagihan</label>
            <input type="text" id="inv-title" required class="w-full p-2 border rounded text-xs" placeholder="misal: SPP Oktober 2026">
          </div>
          <div>
            <label class="block font-bold mb-1">Nominal (Rp)</label>
            <input type="number" id="inv-amount" required class="w-full p-2 border rounded text-xs" placeholder="750000">
          </div>
          <div>
            <label class="block font-bold mb-1">Jatuh Tempo</label>
            <input type="date" id="inv-due" required class="w-full p-2 border rounded text-xs">
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-3 py-1 bg-slate-200 font-bold rounded">Batal</button>
            <button type="submit" class="px-3 py-1 bg-blue-800 text-white font-bold rounded">Terbitkan</button>
          </div>
        </form>
      `);
    }

    async function saveInvoiceForm(e) {
      e.preventDefault();
      await apiCall('saveInvoice', {
        student_id: document.getElementById('inv-student').value,
        title: document.getElementById('inv-title').value,
        amount: parseFloat(document.getElementById('inv-amount').value),
        due_date: document.getElementById('inv-due').value,
        status: 'unpaid'
      });
      closeModal();
      await fetchAndRefreshData();
      renderInvoicesView();
      showToast("Tagihan SPP Berhasil Diterbitkan!");
    }

    async function markInvoicePaid(id) {
      await apiCall('updateInvoiceStatus', { id: id, status: 'paid' });
      await fetchAndRefreshData();
      renderInvoicesView();
      showToast("Status Invoice Diperbarui!");
    }

    function renderUsersView() {
      const container = document.getElementById('view-users');
      container.innerHTML = `
        <div class="flex justify-between items-center">
          <div>
            <h2 class="text-lg font-bold text-slate-800">Kelola Akun, Mapel & Data Siswa</h2>
            <p class="text-xs text-slate-500">Master login Admin, Pengajar, Orang Tua, Mapel & Data Murid</p>
          </div>
          <div class="flex gap-1">
            <button onclick="openUserModal()" class="bg-blue-800 text-white text-[11px] font-bold px-2 py-1.5 rounded-lg shadow">+ User</button>
            <button onclick="openSubjectModal()" class="bg-emerald-800 text-white text-[11px] font-bold px-2 py-1.5 rounded-lg shadow">+ Mapel</button>
            <button onclick="openStudentModal()" class="bg-indigo-800 text-white text-[11px] font-bold px-2 py-1.5 rounded-lg shadow">+ Siswa</button>
          </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-xs text-xs">
          <div class="p-2.5 bg-slate-50 font-bold border-b">Daftar Mata Pelajaran (Mapel) Bimbel</div>
          <div class="divide-y divide-slate-100">
            ${dummyDB.subjects.length === 0 ? `<p class="p-3 text-slate-400 italic">Belum ada mata pelajaran.</p>` : ''}
            ${dummyDB.subjects.map(sub => `
              <div class="p-2.5 flex justify-between items-center">
                <div>
                  <p class="font-bold text-slate-800">${sub.subject_name}</p>
                  <p class="text-[10px] text-slate-500">${sub.description || '-'}</p>
                </div>
                <span class="font-mono text-[9px] bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded font-bold">${sub.id}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-xs text-xs">
          <div class="p-2.5 bg-slate-50 font-bold border-b">Daftar Akun Pengguna Login</div>
          <div class="divide-y divide-slate-100">
            ${dummyDB.users.map(u => `
              <div class="p-2.5 flex justify-between items-center">
                <div>
                  <p class="font-bold text-slate-800">${u.name} <span class="text-[9px] bg-slate-200 px-1 rounded uppercase">${u.role}</span></p>
                  <p class="text-[10px] text-slate-500">Username: ${u.username} | WA: ${u.phone || '-'}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-xs text-xs">
          <div class="p-2.5 bg-slate-50 font-bold border-b">Daftar Data Siswa Bimbel</div>
          <div class="divide-y divide-slate-100">
            ${dummyDB.students.map(s => {
              const p = dummyDB.users.find(u => u.id === s.parent_id);
              const c = dummyDB.classes.find(cls => cls.id === s.class_id);
              return `
                <div class="p-2.5 flex justify-between items-center">
                  <div>
                    <p class="font-bold text-slate-800">${s.name}</p>
                    <p class="text-[10px] text-slate-500">Wali: ${p ? p.name : '-'} | Kelas: ${c ? c.class_name : '-'}</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function openSubjectModal() {
      showModal('Tambah Mata Pelajaran Baru', `
        <form onsubmit="saveSubjectForm(event)" class="space-y-3">
          <div>
            <label class="block font-bold mb-1">Nama Mata Pelajaran</label>
            <input type="text" id="sub-name" required class="w-full p-2 border rounded text-xs" placeholder="misal: Matematika IPA">
          </div>
          <div>
            <label class="block font-bold mb-1">Deskripsi Ringkas</label>
            <input type="text" id="sub-desc" class="w-full p-2 border rounded text-xs" placeholder="misal: Kurikulum Merdeka & Saintek">
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-3 py-1 bg-slate-200 font-bold rounded">Batal</button>
            <button type="submit" class="px-3 py-1 bg-emerald-700 text-white font-bold rounded">Simpan Mapel</button>
          </div>
        </form>
      `);
    }

    async function saveSubjectForm(e) {
      e.preventDefault();
      await apiCall('saveSubject', {
        subject_name: document.getElementById('sub-name').value,
        description: document.getElementById('sub-desc').value
      });
      closeModal();
      await fetchAndRefreshData();
      renderUsersView();
      showToast("Mata Pelajaran Berhasil Ditambahkan!");
    }

    function openUserModal() {
      showModal('Tambah Akun Login Baru', `
        <form onsubmit="saveUserForm(event)" class="space-y-3">
          <div>
            <label class="block font-bold mb-1">Nama Lengkap</label>
            <input type="text" id="u-name" required class="w-full p-2 border rounded text-xs">
          </div>
          <div>
            <label class="block font-bold mb-1">Username</label>
            <input type="text" id="u-username" required class="w-full p-2 border rounded text-xs">
          </div>
          <div>
            <label class="block font-bold mb-1">Role Hak Akses</label>
            <select id="u-role" class="w-full p-2 border rounded text-xs">
              <option value="parent">Orang Tua / Wali</option>
              <option value="teacher">Pengajar / Guru</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div>
            <label class="block font-bold mb-1">No WhatsApp</label>
            <input type="text" id="u-phone" required class="w-full p-2 border rounded text-xs" placeholder="0812345...">
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-3 py-1 bg-slate-200 font-bold rounded">Batal</button>
            <button type="submit" class="px-3 py-1 bg-blue-800 text-white font-bold rounded">Simpan User</button>
          </div>
        </form>
      `);
    }

    async function saveUserForm(e) {
      e.preventDefault();
      await apiCall('saveUser', {
        name: document.getElementById('u-name').value,
        username: document.getElementById('u-username').value,
        role: document.getElementById('u-role').value,
        phone: document.getElementById('u-phone').value
      });
      closeModal();
      await fetchAndRefreshData();
      renderUsersView();
      showToast("Akun User Berhasil Disimpan!");
    }

    function openStudentModal() {
      showModal('Tambah Data Siswa', `
        <form onsubmit="saveStudentForm(event)" class="space-y-3">
          <div>
            <label class="block font-bold mb-1">Nama Siswa</label>
            <input type="text" id="st-name" required class="w-full p-2 border rounded text-xs">
          </div>
          <div>
            <label class="block font-bold mb-1">Orang Tua / Wali</label>
            <select id="st-parent" class="w-full p-2 border rounded text-xs">
              ${dummyDB.users.filter(u => u.role === 'parent').map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block font-bold mb-1">Pilih Kelas</label>
            <select id="st-class" class="w-full p-2 border rounded text-xs">
              ${dummyDB.classes.map(c => `<option value="${c.id}">${c.class_name}</option>`).join('')}
            </select>
          </div>
          <div class="pt-2 flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-3 py-1 bg-slate-200 font-bold rounded">Batal</button>
            <button type="submit" class="px-3 py-1 bg-blue-800 text-white font-bold rounded">Simpan Siswa</button>
          </div>
        </form>
      `);
    }

    async function saveStudentForm(e) {
      e.preventDefault();
      await apiCall('saveStudent', {
        name: document.getElementById('st-name').value,
        parent_id: document.getElementById('st-parent').value,
        class_id: document.getElementById('st-class').value
      });
      closeModal();
      await fetchAndRefreshData();
      renderUsersView();
      showToast("Data Siswa Berhasil Disimpan!");
    }

    function renderSettingsView() {
      const container = document.getElementById('view-settings');
      const cfg = window.APP_CONFIG;

      container.innerHTML = `
        <div>
          <h2 class="text-lg font-bold text-slate-800">Pengaturan SaaS, CS & Rekening Bank</h2>
          <p class="text-xs text-slate-500">Konfigurasi CS Call Center, Identitas Bimbel & Bank Pembayaran</p>
        </div>

        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs max-w-lg">
          <form onsubmit="saveSettingsForm(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-bold mb-1">Nama Lembaga Bimbel</label>
              <input type="text" id="set-name" value="${cfg.appName}" required class="w-full p-2 border rounded text-xs">
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">URL Logo Aplikasi (PNG/JPG)</label>
              <input type="url" id="set-logo" value="${cfg.appLogo}" required class="w-full p-2 border rounded text-xs">
            </div>
            <div>
              <label class="block text-xs font-bold text-emerald-700 mb-1"><i class="fa-brands fa-whatsapp"></i> Nomor WA Call Center CS (Format: 628...)</label>
              <input type="text" id="set-phone" value="${cfg.contactPhone}" required class="w-full p-2 border rounded text-xs font-bold">
            </div>

            <div class="pt-2 border-t border-slate-100 space-y-2">
              <p class="text-xs font-bold text-blue-900"><i class="fa-solid fa-building-columns mr-1"></i> Pengaturan Rekening Pembayaran SPP</p>
              <div>
                <label class="block text-[11px] font-semibold mb-0.5">Nama Bank</label>
                <input type="text" id="set-bank-name" value="${cfg.bankName || ''}" placeholder="misal: Bank BCA" required class="w-full p-2 border rounded text-xs">
              </div>
              <div>
                <label class="block text-[11px] font-semibold mb-0.5">Nomor Rekening</label>
                <input type="text" id="set-bank-account" value="${cfg.bankAccount || ''}" placeholder="misal: 1234567890" required class="w-full p-2 border rounded text-xs font-mono font-bold">
              </div>
              <div>
                <label class="block text-[11px] font-semibold mb-0.5">Atas Nama Rekening</label>
                <input type="text" id="set-bank-holder" value="${cfg.bankHolder || ''}" placeholder="misal: Bimbel Prestasi Digital" required class="w-full p-2 border rounded text-xs">
              </div>
            </div>

            <button type="submit" class="bg-blue-800 text-white font-bold text-xs px-4 py-2 rounded-lg shadow">
              <i class="fa-solid fa-floppy-disk mr-1"></i> Simpan Pengaturan
            </button>
          </form>
        </div>
      `;
    }

    async function saveSettingsForm(e) {
      e.preventDefault();
      window.APP_CONFIG.appName = document.getElementById('set-name').value;
      window.APP_CONFIG.appLogo = document.getElementById('set-logo').value;
      window.APP_CONFIG.contactPhone = document.getElementById('set-phone').value;
      window.APP_CONFIG.bankName = document.getElementById('set-bank-name').value;
      window.APP_CONFIG.bankAccount = document.getElementById('set-bank-account').value;
      window.APP_CONFIG.bankHolder = document.getElementById('set-bank-holder').value;

      await apiCall('saveSetting', window.APP_CONFIG);
      await fetchAndRefreshData();
      showToast('Pengaturan Rekening & CS Berhasil Disimpan!');
      initAppShell();
    }

    function showModal(title, htmlContent) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = htmlContent;
      document.getElementById('app-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('app-modal').classList.add('hidden');
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-16 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs shadow-lg z-50 font-bold';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    // PWA Event Handling
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      document.getElementById('pwa-banner').classList.remove('hidden');
    });

    function installPWA() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.then(() => {
          deferredInstallPrompt = null;
          dismissPWA();
        });
      }
    }

    function dismissPWA() {
      document.getElementById('pwa-banner').classList.add('hidden');
    }
  </script>
</body>
</html>
